# Cheap checks before each commit: pre-commit install
# The same tools run in CI (lint job); CI remains the authority.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # v6.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: ef6cf06c079dd6b299dfc720b0f14400c9d168e1 # v0.17.5
    hooks:
      - id: ruff-check
      - id: ruff-format
  - repo: local
    hooks:
      - id: actionlint
        name: actionlint
        language: python
        additional_dependencies: [actionlint-py==1.7.12.25, shellcheck-py==0.11.0.1]
        entry: actionlint
        files: ^\.github/workflows/
