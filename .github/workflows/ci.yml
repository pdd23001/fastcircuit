# Pull requests and pushes to main: lint, tests on both backends, coverage, package.
# Branch protection should require the single aggregate check "ci-ok" (docs/ci.md).
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseded pull-request runs are cancelled; runs on main always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"
  FORCE_COLOR: "1"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Install tox
        run: |
          python -m pip install --upgrade "pip>=25.1"
          python -m pip install -c ci/constraints.txt tox
      # The same command contributors run locally (tox.ini): ruff, mypy, actionlint.
      - name: tox -e lint
        run: tox -e lint

  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }}, ${{ matrix.backend }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        python: ["3.11", "3.14"]
        backend: [llvm, c]
    env:
      FASTCIRCUIT_BACKEND: ${{ matrix.backend }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install (non-editable, so tests exercise the installed package)
        run: |
          python -m pip install --upgrade "pip>=25.1"
          python -m pip install -c ci/constraints.txt . --group test
      - name: Environment
        run: python -m fastcircuit doctor
      - name: Unit, component and integration tests
        env:
          FASTCIRCUIT_CACHE_DIR: ${{ runner.temp }}/fastcircuit-cache
        run: python -m coverage run -m pytest tests/unit tests/component tests/integration
      - name: Upload coverage data
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ matrix.os }}-py${{ matrix.python }}-${{ matrix.backend }}
          path: .coverage.*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  coverage:
    name: coverage
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Install coverage
        run: python -m pip install -c ci/constraints.txt coverage
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-*
          merge-multiple: true
      - name: Combine and check the baseline (fail_under in pyproject.toml)
        run: |
          python -m coverage combine
          python -m coverage html
          python -m coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
          python -m coverage report
      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-html
          path: htmlcov
          retention-days: 14

  package:
    # The same build and smoke tests release.yml runs before publishing.
    name: package
    uses: ./.github/workflows/package.yml

  ci-ok:
    # The one check branch protection requires: green only if every job above passed.
    name: ci-ok
    if: always()
    needs: [lint, test, coverage, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: All required jobs passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then exit 1; fi
          done
