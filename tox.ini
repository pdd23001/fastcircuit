# One command per check, with the versions CI uses (ci/constraints.txt).
# CI's lint job runs `tox -e lint`, so a local pass means a CI pass for lint.
#
#   tox                 lint, then the tests on the default and C backends
#   tox -e lint         ruff, mypy (Linux and macOS rules), actionlint
#   tox -e format       apply ruff formatting and safe lint fixes
#   tox -e py           tests on the default backend; tox -e py312 for a specific Python
#   tox -e c            tests on the C backend
#   tox -e coverage     both backends, combined branch coverage, CI's floor
#   tox -e package      build the sdist and wheel and check their metadata
#   tox -e docs         build the documentation site, every warning an error
#                       (tox -e docs -- serve: live preview at http://127.0.0.1:8000)
#
# Arguments after `--` go to pytest, e.g. `tox -e py -- tests/unit -k cache`.

[tox]
requires = tox>=4.28
env_list = lint, py, c

[testenv]
description = tests on the default backend (LLVM where llvmlite installs, otherwise C)
# Installs the built package, not the source tree, as CI does.
constraints = ci/constraints.txt
dependency_groups = test
passenv =
  CC
  FASTCIRCUIT_EXTRA_CFLAGS
commands =
  python -m fastcircuit doctor
  python -m pytest {posargs:tests/unit tests/component tests/integration}

[testenv:c]
description = tests on the C backend (needs a C compiler)
set_env =
  FASTCIRCUIT_BACKEND = c

[testenv:lint]
description = the CI lint job: ruff, mypy for Linux and macOS, actionlint
dependency_groups =
  lint
  test
commands =
  ruff check .
  ruff format --check .
  mypy --platform linux
  mypy --platform darwin
  actionlint

[testenv:format]
description = apply ruff formatting and safe lint fixes
skip_install = true
dependency_groups = lint
commands =
  ruff format .
  ruff check --fix .

[testenv:coverage]
description = tests on both backends with combined branch coverage (CI's floor)
allowlist_externals = env
commands =
  python -m coverage erase
  python -m coverage run -m pytest {posargs:tests/unit tests/component tests/integration}
  env FASTCIRCUIT_BACKEND=c python -m coverage run -m pytest {posargs:tests/unit tests/component tests/integration}
  python -m coverage combine
  python -m coverage report

[testenv:package]
description = build the sdist and wheel and check them as PyPI would
skip_install = true
dependency_groups = release
allowlist_externals = bash
commands =
  bash -c 'rm -rf "$0" && python -m build --outdir "$0" && python -m twine check --strict "$0"/*' {env_tmp_dir}/dist

[testenv:docs]
description = build the documentation site (mkdocs.yml); every warning is an error
skip_install = true
dependency_groups = docs
# Material for MkDocs' end-of-life notice (May 2027) is printed on every build.
set_env = NO_MKDOCS_2_WARNING=1
commands =
  mkdocs {posargs:build --strict --site-dir {env_tmp_dir}/site}
